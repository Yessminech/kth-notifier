services:
  - type: worker
    name: kthesisbot-worker
    runtime: python3
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      BOT_TOKEN: 
        sync: false
      CHAT_ID: 
        sync: false

cronJobs:
  - name: daily-check
    schedule: "30 7 * * *"
    workerName: kthesisbot-worker
    command: "python bot.py"
