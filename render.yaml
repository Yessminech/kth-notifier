services:
  - type: worker
    name: kthesisbot-worker
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false

cronJobs:
  - name: daily-check
    schedule: "30 7 * * *"
    command: python bot.py
    workerName: kthesisbot-worker
